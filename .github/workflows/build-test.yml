name: Vyapar OS build and test

'on':
workflow_dispatch:

permissions:
contents: read

jobs:
pwa:
name: Test and build PWA
runs-on: ubuntu-latest
defaults:
run:
working-directory: source/vyaparos-project-source

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm install --no-audit --no-fund

  - name: Type check
    continue-on-error: true
    run: npm run lint

  - name: Run tests
    continue-on-error: true
    run: npm test -- --reporter=default

  - name: Build PWA
    run: npm run build

  - name: Upload PWA build
    uses: actions/upload-artifact@v4
    with:
      name: vyapar-os-pwa-dist
      path: source/vyaparos-project-source/dist/
      if-no-files-found: error
      retention-days: 14

android:
name: Build Android APK
runs-on: ubuntu-latest
defaults:
run:
working-directory: source/vyaparos-project-source

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Install dependencies
    run: npm install --no-audit --no-fund

  - name: Build web assets
    run: npm run build

  - name: Verify Capacitor configuration
    run: |
      test -f capacitor.config.ts || test -f capacitor.config.json
      npx cap --version

  - name: Add Android platform if missing
    shell: bash
    run: |
      if [ ! -d android ]; then
        npx cap add android
      fi

  - name: Sync Capacitor
    run: npx cap sync android

  - name: Build debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload Android APK
    uses: actions/upload-artifact@v4
    with:
      name: vyapar-os-android-debug-apk
      path: source/vyaparos-project-source/android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 14
