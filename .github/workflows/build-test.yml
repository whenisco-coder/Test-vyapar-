name: Vyapar OS build and test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: Test and build PWA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/vyaparos-project-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/vyaparos-project-source/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Non-blocking on purpose: these do not gate the artifact yet.
      - name: Type check
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        continue-on-error: true
        run: npm test -- --reporter=default

      - name: Build PWA
        run: npm run build

      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-os-pwa-dist
          path: source/vyaparos-project-source/dist/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    needs: pwa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/vyaparos-project-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/vyaparos-project-source/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Verify Capacitor configuration
        run: |
          set -euo pipefail
          test -f capacitor.config.ts || test -f capacitor.config.json
          npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: source/vyaparos-project-source/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vyapar-os-android-debug-apk
          path: source/vyaparos-project-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
